<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form 4 - Contact Us </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1 style="text-align:center;">Contact Us</h1>
        
        </header>
        <main>
            <div style="display: flex;
            justify-content: center;
             align-items: center;"> 
            <form>
                <label for="lastname">Last Name:</label>
                
                <input type="text" id="lastname" placeholder="Enter your last name here" required minlength="3" maxlength="50">

                

                <label for="firstname">First Name:</label>
                
                <input type="text" id="firstname" placeholder="Enter your first name here" required minlength="3" maxlength="50">

                

                <label for="dateofbirth">Date of birth:</label>
                
                <input type="date" id="dateofbirth" placeholder="Enter your date of birth" required max="2023-08-03">

                

                <label for="age">Age:</label>
                
                <input type="number" id="age" placeholder="Enter your age" required min="3" max="70">

                

                <label for="gender">Gender:</label>
                
                <select id="gender" name="gender" required>
                    <option value="">Select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                

                <label for="phonenumber">Phone Number:</label>
                
                <input type="tel" id="phonenumber" pattern="[0-9]{3}-[0-9]{4}" placeholder="Enter your phone number" required>

                

                <label for="email">Email:</label>
                
                <input type="email" id="email" placeholder="Enter your email" required>

                

                <label for="address">Address:</label>
                
                <input type="text" id="address" name="address" autocomplete="address" placeholder="Enter your Address" required>


                

                <label for="subject">Subjects:</label>
                
                <input type="text" id="subject" name="subject" placeholder="Enter your subject you want to talk about" required>

                

                <label for="message">Tell me more about this subject:</label>
                
                <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your message"></textarea>

                


                <button type="submit">Submit</button>
            </form>
        </main>
    </body>
    <footer>
        <p style="text-align: center;">&copy; 2023 student survey. All rights reserved.</p>
    </footer>
</html>
