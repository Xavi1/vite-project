<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form 5 - Feedback Form </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1 style="text-align:center;">Feedback Form</h1>
        
        </header>
        <main>
       
                <form ACTION="/submit-feedback" METHOD="POST">
                    <label feedback for="rating">Rate your experience:</label>
                    <div class="rating">
                        <label><input type="radio" name="rating" value="1" /> 1</label>
                        <label><input type="radio" name="rating" value="2" /> 2</label>
                        <label><input type="radio" name="rating" value="3" /> 3</label>
                        <label><input type="radio" name="rating" value="4" /> 4</label>
                        <label><input type="radio" name="rating" value="5" /> 5</label>
                    </div> 
                    

                    <label for="comments">Comments:</label>
                    
                    <textarea id="comments" name="comments" rows="4" cols="50"></textarea>

                    

                    <label>Would you recommend us?</label>
                    
                    <label><input type="radio" name="recommend" value="yes" /> Yes</label>
                    <label><input type="radio" name="recommend" value="no" /> No</label>

                    

                    <button type="submit">Submit</button>
                </form>
            
        </main>
    </body>
    <footer>
        <p style="text-align: center;">&copy; 2023 Feedback Form. All rights reserved.</p>
    </footer>
</html>
