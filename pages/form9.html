<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form 9 - Gym Membership Form </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1 style="text-align:center;">Gym Membership Form</h1>
        
        </header>
        <main>
                <form ACTION="/submit-feedback" METHOD="POST">

                    <label for="lastname">Last Name:</label>
                
                    <input type="text" id="lastname" placeholder="Enter your last name here" required minlength="3" maxlength="50">

                    

                    <label for="firstname">First Name:</label>
                    
                    <input type="text" id="firstname" placeholder="Enter your first name here" required minlength="3" maxlength="50">

                

                    <label for="phonenumber">Phone Number:</label>
                
                    <input type="tel" id="phonenumber" placeholder="Enter your phone number here" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">

                

                    <label for="email">Email:</label>
                
                    <input type="email" id="email" placeholder="Enter your email here" required>

                

                    <label for="gender">Gender:</label>
                
                    <select id="gender" name="gender" required>
                        <option value="">Select your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>

                

                    <select id="membership" name="membership" required>
                        <option value="">Select your membership type</option>
                        <option value="Standard">Standard</option>
                        <option value="Premium">Premium</option>
                        <option value="VIP">VIP</option>
                    </select>

            

                    <label for="membership">Select your membership type:</label>
                
                    <select id="membership" name="membership" required>
                        <option value="">Select your membership type</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>

                

                    <label for="training">Select your preferred training time:</label>
                
                    <select id="training" name="training" required>
                        <option value="">Select your preferred training time</option>
                        <option value="morning">Morning</option>
                        <option value="afternoon">Afternoon</option>
                        <option value="evening">Evening</option>
                    </select>

                

                    <label for="training">how do you prefer to workout with:</label>
                
                    <select id="training with" name="training with " required>
                        <option value="">Select your preferred training with</option>
                        <option value="personal trainer">Personal Trainer</option>
                        <option value="group classes">Group Classes</option>
                        <option value="self-guided">Self-Guided</option>
                    </select>

                
                    
                    <label for="goals">What are your fitness goals?</label>
                    
                    <textarea id="goals" name="goals" rows="4" cols="50" placeholder="Enter your fitness goals here" required></textarea>

                

                    <label for="rating">Rate how serious your goal is:</label>
                
                    <label><input type="radio" name="rating" value="1" /> 1</label>
                    <label><input type="radio" name="rating" value="2" /> 2</label>
                    <label><input type="radio" name="rating" value="3" /> 3</label>
                    <label><input type="radio" name="rating" value="4" /> 4</label>
                    <label><input type="radio" name="rating" value="5" /> 5</label>

                

                    <h3>Emergency Contact:</h3>
                
                    <label for="lastname">Last Name:</label>
                
                    <input type="text" id="lastname" placeholder="Enter your last name here" required minlength="3" maxlength="50">

                

                    <label for="firstname">First Name:</label>
            
                    <input type="text" id="firstname" placeholder="Enter your first name here" required minlength="3" maxlength="50">

                

                    <label for="relationship">Relationship:</label>
                
                    <select id="relationship" name="relationship" required>
                        <option value="">Select your relationship</option>
                        <option value="parent">Parent</option>
                        <option value="sibling">Sibling</option>
                        <option value="spouse">Spouse</option>
                        <option value="friend">Friend</option>
                        <option value="other">Other</option>
                    </select>

            

                    <label for="phonenumber">Phone Number:</label>
                    
                    <input type="tel" id="phonenumber" placeholder="Enter your phone number here" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">

                

                    <label for="backupnumber">Backup Phone Number:</label>
                
                    <input type="tel" id="backupnumber" placeholder="Enter your backup phone number here" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">

                

                    <label>Would you recommend us?</label>
                
                    <label><input type="radio" name="recommend" value="yes" /> Yes</label>
                    <label><input type="radio" name="recommend" value="no" /> No</label>

                

                    <button type="submit">Submit</button>
                </form>
        </main>
    </body>
    <footer>
        <p style="text-align: center;">&copy; 2023 Gym Members Form. All rights reserved.</p>
    </footer>
</html>
