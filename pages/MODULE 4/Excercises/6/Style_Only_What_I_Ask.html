<!--
    - Make all h2 elements blue.
    - Make paragraphs directly inside .post gray.
    - Make paragraphs inside .author red.
    - Make only the first paragraph of each article bold.
    - Make all h2 elements inside .post uppercase.
-->

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Exercise 2</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <main>
            <h1>My Blog</h1>

            <article class="post">
                <h2>My First Post</h2>

                <p>This is my first paragraph.</p>
                <p>This is my second paragraph.</p>

                <div class="author">
                    <p>Written by John</p>
                </div>
            </article>

            <article class="post">
                <h2>My Second Post</h2>

                <p>This is another paragraph.</p>
            </article>
        </main>

    </body>
</html>
