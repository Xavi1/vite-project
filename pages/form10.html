<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form 10 - Personal Form</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Welcome to the personal form</h1>
        </header>
        <main>
         
            <form>
                <label for="lastname">Last Name:</label>
                <br>
                <input type="text" id="lastname" placeholder="Enter your last name here" required>

                <br><br>

                <label for="firstname">First Name:</label>
                <br>
                <input type="text" id="firstname" placeholder="Enter your first name here" required>

                <br><br>

                <label for="dateofbirth">Date of birth:</label>
                <br>
                <input type="date" id="dateofbirth" placeholder="Enter your date of birth" required max="2023-08-03">

                <br><br>

                <label for="age">Age:</label>
                <br>
                <input type="number" id="age" placeholder="Enter your age" required min="3" max="70">

                <br><br>

                <label for="gender">Gender:</label>
                <br>
                <select id="gender" name="gender" required>
                    <option value="">Select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                <br><br>

                <label for="phonenumber">Phone Number:</label>
                <br>
                <input type="tel" id="phonenumber" pattern="[0-9]{3}-[0-9]{4}" placeholder="Enter your phone number" required>

                <br><br>

                <label for="email">Email:</label>
                <br>
                <input type="email" id="email" placeholder="Enter your email" required>

                <br><br>

                <label for="address">Address:</label>
                <br>
                <input type="text" id="address" name="address" autocomplete="address" placeholder="Enter your Address" required>

                <br><br>

                <label for="employement">Employment Status:</label>
                <br>
                <select id="employement" name="employment" required>
                    <option value="">Select your employment status</option>
                    <option value="employed">Employed</option>  
                    <option value="unemployed">Unemployed</option>
                    <option value="student">Student</option>
                    <option value="retired">Retired</option>
                </select>

                <br><br>

                <label for="education">Education Level:</label>
                <br>
                <select id="education" name="education" required>
                    <option value="">Select your education level</option>
                    <option value="highschool">High School</option>
                    <option value="bachelor">Bachelor's Degree</option>
                    <option value="master">Master's Degree</option>
                    <option value="doctorate">Doctorate</option>
                    <option value="other">Other</option>
                    <option value="none">None</option>
                </select>

                <br><br>

                <label for="hobbies">Hobbies:</label>
                <br>
                <ul style="list-style-type: none;">
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="reading">Reading</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="sports">Sports</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="traveling">Traveling</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="  music">Music</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="gaming">Gaming</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="cooking">Cooking</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="other">Other</li>
                </ul>

                <br><br>

                <label for="languages">Favourite Languages:</label>
                <br>
                <ul style="list-style-type: none;">
                    <li><input type="radio" id="languages" name="languages" value="english">English</li>
                    <li><input type="radio" id="languages" name="languages" value="spanish">Spanish</li>
                    <li><input type="radio" id="languages" name="languages" value="french">French</li>
                    <li><input type="radio" id="languages" name="languages" value="german">German</li>
                    <li><input type="radio" id="languages" name="languages" value="other">Other</li>
                </ul>

                <br><br>

                <h3>Upload your files here!</h3>

                <br><br>
               
                <label for="profile-picture-upload">Choose your profile picture</label>
                <br><br>
                <input type="file" id="profile-picture-upload" name="profile_picture" accept=".jpeg,.jpg,.png" required>

                <br><br>

                <label for="resume-upload">Choose your resume file</label> 
                <br><br>
                <input type="file" id="resume-upload" name="resume" accept=".docx, .pdf" required>
                
                <br><br>

                <label for="birth-certificate-upload">Choose your birth certificate file</label> 
                <br><br>
                <input type="file" id="birth-certificate-upload" name="birth_certificate" accept=".pdf,.jpeg,.jpg,.png" required>

                <br><br>

                <label for="qualification-upload">Choose your qualification files</label> 
                <br><br>
                <input type="file" id="qualification-upload" name="qualification" accept=".docx, .pdf" required>

                <br><br>

                <label for="other-certificate-upload">Choose your other certificate files</label> 
                <br><br>
                <input type="file" id="other-certificate-upload" name="other_certificates" accept=".pdf,.jpeg,.jpg,.png" required>
                
                <br><br>

                <label for="medical-files-upload">Choose your medical files</label> 
                <br><br>
                <input type="file" id="medical-files-upload" name="medical_files" accept=".pdf,.jpeg,.jpg,.png" required>
                
                <br><br>


                <button type="submit">Submit</button>
            </form>
        </main>
    </body>
    <footer>
        <p>&copy; 2023 Personel Form. All rights reserved.</p>
    </footer>
</html>
