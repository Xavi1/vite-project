<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form 3 - Human survey</title>
        <link rel="stylesheet" href="../style.css">
        
    </head>
    <body>
        <header>
            <h1 style="text-align:center;">Welcome to the human survey</h1>
        
        </header>
        <main>
        
            <form>
                <label for="lastname">Last Name:</label>
                
                <input type="text" id="lastname" placeholder="Enter your last name here" required>

                

                <label for="firstname">First Name:</label>
                
                <input type="text" id="firstname" placeholder="Enter your first name here" required>

                

                <label for="dateofbirth">Date of birth:</label>
                
                <input type="date" id="dateofbirth" placeholder="Enter your date of birth" required max="2023-08-03">

                

                <label for="age">Age:</label>
                
                <input type="number" id="age" placeholder="Enter your age" required min="3" max="70">

                

                <label for="gender">Gender:</label>
                
                <select id="gender" name="gender" required>
                    <option value="">Select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                

                <label for="phonenumber">Phone Number:</label>
                
                <input type="tel" id="phonenumber" pattern="[0-9]{3}-[0-9]{4}" placeholder="Enter your phone number" required>

                

                <label for="email">Email:</label>
                
                <input type="email" id="email" placeholder="Enter your email" required>

                

                <label for="address">Address:</label>
                
                <input type="text" id="address" name="address" autocomplete="address" placeholder="Enter your Address" required>

                

                <label for="employement">Employment Status:</label>
                
                <select id="employement" name="employment" required>
                    <option value="">Select your employment status</option>
                    <option value="employed">Employed</option>  
                    <option value="unemployed">Unemployed</option>
                    <option value="student">Student</option>
                    <option value="retired">Retired</option>
                </select>

                

                <label for="education">Education Level:</label>
                
                <select id="education" name="education" required>
                    <option value="">Select your education level</option>
                    <option value="highschool">High School</option>
                    <option value="bachelor">Bachelor's Degree</option>
                    <option value="master">Master's Degree</option>
                    <option value="doctorate">Doctorate</option>
                    <option value="other">Other</option>
                    <option value="none">None</option>
                </select>

                

                <label for="hobbies">Hobbies:</label>
                
                <ul style="list-style-type: none;">
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="reading">Reading</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="sports">Sports</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="traveling">Traveling</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="  music">Music</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="gaming">Gaming</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="cooking">Cooking</li>
                    <li><input type="checkbox" id="hobbies" name="hobbies" value="other">Other</li>
                </ul>


                <label for="languages">Favourite Languages:</label>
                
                <ul style="list-style-type: none;">
                    <li><input type="radio" id="languages" name="languages" value="english">English</li>
                    <li><input type="radio" id="languages" name="languages" value="spanish">Spanish</li>
                    <li><input type="radio" id="languages" name="languages" value="french">French</li>
                    <li><input type="radio" id="languages" name="languages" value="german">German</li>
                    <li><input type="radio" id="languages" name="languages" value="other">Other</li>
                </ul>

                

                <label for="message">Tell me more about yourself:</label>
                
                <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your message"></textarea>

                


                <button type="submit">Submit</button>
            </form>
        </main>
    </body>
    <footer>
        <p style="text-align: center;">&copy; 2023 Human Survey. All rights reserved.</p>
    </footer>
</html>
