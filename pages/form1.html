<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form 1 - Basic Login Form</title>
    </head>
    <body>
        <form>
            <label for="username">Username:</label>

            <br>

            <input type="text" id="username" placeholder="Enter your username" required>

            <br><br>

            <label for="email">Email:</label>

            <br>

            <input type="email" id="email" placeholder="Enter your email" required>

            <br><br>

            <label for="password">Password:</label>

            <br>

            <input type="password" id="password" placeholder="Enter your password" required>

            <br><br>
            <button type="submit">Login</button>
        </form>   

        <h2 style="text-align: center;">Thank you for contacting us! We will get back to you as soon as possible.</h2>

         <div style="text-align: center;">
            <a href="https://www.youtube.com/watch?v=Aq5WXmQQooo" target="_blank"><img src= "https://thumbs.dreamstime.com/b/thank-you-message-person-using-laptop-computer-168457246.jpg" alt= "Thank You" class= "Thank You Avatar" width= "600" height= "300"></a>
        </div>
        
    </body>
</html>
