<!--Basic Upload-->

<form action="/upload-destination" method="POST" enctype="multipart/form-data">
  <label for="file-upload">Choose a file:</label>
  <input type="file" id="file-upload" name="myFile">
  
  <button type="submit">Submit Form</button>
</form>

<!-- Example allowing multiple images only -->
<input type="file" id="file-upload" name="photos" accept="image/*" multiple>

<!-- so for the accept constraint you can also add a specific file type as well for example accept=".txt"-->
