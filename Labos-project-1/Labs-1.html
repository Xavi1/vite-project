<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Labos Project 1</title>
    </head>
    <body>
        <h1 style="text-align: center;"><b>Welcome to tech support!</b></h1>
        <h3 style="text-align: center;">Where we figure out your computer problems!</h3>
        <div style="text-align: center;">
            <img src= "https://itadon.com/wp-content/uploads/2024/05/IT-1.webp" alt= "Tech Support Avatar" class= "Tech Support Avatar" width= "600" height= "300">
        </div>

        <br><br>


        <div style="text-align: center;"> 

        <Main>
            <form> 
                
                
                <label for="lastname">Last Name:</label>

                <br>

                <input type="text" id="lastname" placeholder="Enter your last name" required>

                <br><br>

                <label for="firstname">First Name:</label>

                <br>

                <input type="text" id="firstname" placeholder="Enter your first name" required>

                <br><br>

                <label for="email">Email:</label>

                <br>

                <input type="email" id="email" placeholder="Enter your email" required>

                <br><br>

                <label for="message">Computer Problems:</label>

                <br>

                <textarea row="5" type="textarea" id="message" placeholder="Enter computer problems" required></textarea>

                <br><br>
                <button type="submit">Submit</button>
                
            </form>

    
        </Main>
        
        
        <br><br>
        
        <h2 style="text-align: center;">Thank you for contacting us! We will get back to you as soon as possible.</h2>

         <div style="text-align: center;">
            <a href="https://www.youtube.com/watch?v=Aq5WXmQQooo" target="_blank"><img src= "https://thumbs.dreamstime.com/b/thank-you-message-person-using-laptop-computer-168457246.jpg" alt= "Thank You" class= "Thank You Avatar" width= "600" height= "300"></a>
        </div>
    </body>
